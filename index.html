<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-TabunganKu - TK</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <!-- TAMBAHKAN LIBRARY CHART.JS DI SINI -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #0f172a; /* Slate 900 */
      color: #f8fafc; /* Slate 50 */
    }
    
    /* Custom Scrollbar Premium */
    ::-webkit-scrollbar { width: 8px; height: 8px;}
    ::-webkit-scrollbar-track { background: #1e293b; }
    ::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #059669; }

    /* Glassmorphism */
    .glass-panel {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.05);
    }
    
    .input-dark {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid #334155;
      color: white;
    }
    .input-dark:focus {
      border-color: #10b981;
      outline: none;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
    }

    /* Animasi Transisi Halus */
    .fade-in { animation: fadeIn 0.4s ease-in-out; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    
    /* Loader Spinner */
    .loader {
      border-top-color: #10b981;
      -webkit-animation: spinner 1.5s linear infinite;
      animation: spinner 1.5s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* SweetAlert Dark Theme Override */
    .swal2-popup {
      background: #1e293b !important;
      color: #f8fafc !important;
      border: 1px solid #334155 !important;
    }
    .swal2-title { color: #f8fafc !important; }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col">

  <div id="loader" class="fixed inset-0 z-50 bg-slate-900 bg-opacity-80 backdrop-blur-sm flex items-center justify-center hidden">
    <div class="flex flex-col items-center">
      <div class="loader ease-linear rounded-full border-4 border-slate-700 h-16 w-16 mb-4"></div>
      <h2 class="text-emerald-400 font-semibold text-lg animate-pulse">Memproses Data...</h2>
    </div>
  </div>

  <div id="view-login" class="flex-1 flex items-center justify-center p-4 fade-in">
    <div class="glass-panel p-8 rounded-2xl shadow-2xl w-full max-w-md border-t-4 border-emerald-500">
      <div class="text-center mb-8">
        <div class="w-20 h-20 bg-emerald-500/20 rounded-full flex items-center justify-center mx-auto mb-4 border border-emerald-500/50">
          <i class="fas fa-wallet text-4xl text-emerald-400"></i>
        </div>
        <h1 class="text-3xl font-bold text-white">E-TabunganKu</h1>
        <p class="text-slate-400 mt-2">Portal Keuangan Digital TK</p>
      </div>
      
      <form id="form-login" onsubmit="handleLogin(event)">
        <div class="mb-5">
          <label class="block text-sm font-medium text-slate-300 mb-1"><i class="fas fa-user text-emerald-400 w-5"></i> Username</label>
          <input type="text" id="username" required class="input-dark w-full px-4 py-3 rounded-lg transition-colors" placeholder="Masukkan username">
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-slate-300 mb-1"><i class="fas fa-lock text-emerald-400 w-5"></i> Password</label>
          <input type="password" id="password" required class="input-dark w-full px-4 py-3 rounded-lg transition-colors" placeholder="Masukkan password">
        </div>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg shadow-emerald-500/30 transition-all transform hover:-translate-y-1">
          Masuk Sistem
        </button>
      </form>
    </div>
  </div>

  <div id="view-dashboard" class="hidden flex-1 flex-col md:flex-row min-h-screen fade-in relative w-full">
    
    <!-- Mobile Header (Hanya muncul di HP) -->
    <div class="md:hidden flex items-center justify-between p-4 glass-panel border-b border-slate-700 w-full z-20 shadow-lg shrink-0">
      <div class="flex items-center space-x-2">
        <i class="fas fa-wallet text-2xl text-emerald-400"></i>
        <h2 class="text-lg font-bold text-white">E-TabunganKu</h2>
      </div>
      <button onclick="toggleMobileMenu()" class="text-slate-300 hover:text-emerald-400 focus:outline-none p-2 bg-slate-800 rounded border border-slate-700">
        <i class="fas fa-bars text-xl"></i>
      </button>
    </div>

    <!-- Overlay Mobile (Gelap saat menu terbuka) -->
    <div id="mobile-overlay" onclick="toggleMobileMenu()" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-40 hidden md:hidden transition-opacity"></div>
    
    <!-- Sidebar -->
    <aside id="sidebar" class="fixed inset-y-0 left-0 transform -translate-x-full md:relative md:translate-x-0 transition duration-300 ease-in-out w-64 glass-panel min-h-screen flex flex-col shadow-2xl border-r border-slate-700 z-50 shrink-0">
      <div class="p-6 text-center border-b border-slate-700 relative shrink-0">
        <button onclick="toggleMobileMenu()" class="md:hidden absolute top-4 right-4 text-slate-400 hover:text-white bg-slate-800 p-2 rounded">
          <i class="fas fa-times text-lg"></i>
        </button>
        <i class="fas fa-wallet text-3xl text-emerald-400 mb-2"></i>
        <h2 class="text-xl font-bold text-white">E-TabunganKu</h2>
        <span id="badge-role" class="inline-block mt-2 px-3 py-1 bg-emerald-500/20 text-emerald-400 text-xs rounded-full border border-emerald-500/30">Role</span>
      </div>
      
      <nav class="flex-1 p-4 space-y-2 overflow-y-auto" id="nav-menu">
        <!-- Menu akan di-render via JS berdasarkan Role -->
      </nav>
      
      <div class="p-4 border-t border-slate-700 text-center shrink-0">
        <p class="text-sm text-slate-400 mb-2" id="user-info-name">Halo, User</p>
        <button onclick="logout()" class="w-full py-2 px-4 bg-slate-800 hover:bg-red-500/20 text-red-400 rounded-lg transition-colors border border-slate-700 hover:border-red-500">
          <i class="fas fa-sign-out-alt mr-2"></i> Keluar
        </button>
      </div>
    </aside>

    <!-- Main Content Area -->
    <main class="flex-1 p-4 md:p-8 overflow-y-auto w-full relative" id="main-content">
      <!-- Konten dinamis masuk kesini -->
    </main>
  </div>

  <!-- Modal Siswa (Di luar layout utama agar tidak bertabrakan dengan menu) -->
  <div id="modal-siswa" class="fixed inset-0 z-[60] bg-slate-900/80 backdrop-blur-sm hidden items-center justify-center p-4">
    <div class="glass-panel w-full max-w-md rounded-2xl border border-slate-700 shadow-2xl overflow-hidden fade-in relative">
      <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-blue-500"></div>
      <div class="p-6 border-b border-slate-700 flex justify-between items-center">
        <h3 class="text-xl font-bold text-white" id="modal-siswa-title">Tambah Siswa Baru</h3>
        <button onclick="closeModalSiswa()" class="text-slate-400 hover:text-white"><i class="fas fa-times"></i></button>
      </div>
      <form id="form-siswa" onsubmit="simpanSiswa(event)" class="p-6">
        <input type="hidden" id="siswa-id">
        <div class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Nama Lengkap</label>
            <input type="text" id="siswa-nama" required class="input-dark w-full px-4 py-2 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">Kelas</label>
            <input type="text" id="siswa-kelas" required class="input-dark w-full px-4 py-2 rounded-lg">
          </div>
          <div>
            <label class="block text-sm font-medium text-slate-300 mb-1">No WhatsApp Orang Tua</label>
            <input type="number" id="siswa-wa" required class="input-dark w-full px-4 py-2 rounded-lg" placeholder="08...">
          </div>
          <div class="grid grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1">Username Login</label>
              <input type="text" id="siswa-user" required class="input-dark w-full px-4 py-2 rounded-lg">
            </div>
            <div>
              <label class="block text-sm font-medium text-slate-300 mb-1">Password</label>
              <input type="text" id="siswa-pass" required class="input-dark w-full px-4 py-2 rounded-lg">
            </div>
          </div>
        </div>
        <div class="flex justify-end space-x-3 mt-6">
          <button type="button" onclick="closeModalSiswa()" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 rounded-lg text-white transition-colors">Batal</button>
          <button type="submit" class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white font-bold transition-colors">Simpan Data</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    let currentUser = null;
    let dataSiswaCache = [];
    let currentNav = 'dashboard';

    // Format Rupiah
    const formatRp = (angka) => {
      return new Intl.NumberFormat('id-ID', { style: 'currency', currency: 'IDR', minimumFractionDigits: 0 }).format(angka);
    };

    // UI Helpers
    const showLoader = () => document.getElementById('loader').classList.remove('hidden');
    const hideLoader = () => document.getElementById('loader').classList.add('hidden');
    
    // Alert System dengan SweetAlert2
    const showAlert = (title, text, icon) => {
      Swal.fire({
        title: title,
        text: text,
        icon: icon,
        confirmButtonColor: '#10b981',
        background: '#1e293b',
        color: '#f8fafc'
      });
    };

    // Fungsi Hamburger Menu Mobile
    function toggleMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-overlay');
      sidebar.classList.toggle('-translate-x-full');
      overlay.classList.toggle('hidden');
    }

    function closeMobileMenu() {
      const sidebar = document.getElementById('sidebar');
      const overlay = document.getElementById('mobile-overlay');
      if (!sidebar.classList.contains('-translate-x-full')) {
        sidebar.classList.add('-translate-x-full');
        overlay.classList.add('hidden');
      }
    }

    function handleLogin(e) {
      e.preventDefault();
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;
      
      showLoader();
      google.script.run
        .withSuccessHandler(res => {
          hideLoader();
          if (res.success) {
            currentUser = res.user;
            document.getElementById('view-login').classList.add('hidden');
            document.getElementById('view-dashboard').classList.remove('hidden');
            document.getElementById('view-dashboard').classList.add('flex');
            
            // Set Info Sidebar
            document.getElementById('badge-role').innerText = currentUser.role;
            document.getElementById('user-info-name').innerText = "Halo, " + currentUser.nama;
            
            buildNavigation();
            navigate('dashboard');
          } else {
            showAlert('Login Gagal', res.message, 'error');
          }
        })
        .withFailureHandler(err => {
          hideLoader();
          showAlert('Error', err.message, 'error');
        })
        .loginUser(user, pass);
    }

    function logout() {
      currentUser = null;
      document.getElementById('view-dashboard').classList.add('hidden');
      document.getElementById('view-dashboard').classList.remove('flex');
      document.getElementById('view-login').classList.remove('hidden');
      document.getElementById('form-login').reset();
    }

    function buildNavigation() {
      const navMenu = document.getElementById('nav-menu');
      navMenu.innerHTML = ''; // Reset
      
      const menus = currentUser.role === 'Admin' ? [
        { id: 'dashboard', icon: 'fa-chart-pie', text: 'Dashboard' },
        { id: 'siswa', icon: 'fa-users', text: 'Kelola Siswa' },
        { id: 'transaksi', icon: 'fa-exchange-alt', text: 'Input Transaksi' },
        { id: 'rekap', icon: 'fa-file-invoice-dollar', text: 'Rekap & Riwayat' }
      ] : [
        { id: 'dashboard', icon: 'fa-book', text: 'Buku Tabungan' }
      ];

      menus.forEach(m => {
        const btn = document.createElement('button');
        btn.id = `nav-btn-${m.id}`;
        btn.className = 'w-full flex items-center p-3 rounded-lg transition-all duration-300 text-slate-300 hover:bg-slate-800 hover:text-emerald-400';
        btn.innerHTML = `<i class="fas ${m.icon} w-6 text-center mr-2"></i> ${m.text}`;
        btn.onclick = () => navigate(m.id);
        navMenu.appendChild(btn);
      });
    }

    function navigate(viewId) {
      currentNav = viewId;
      
      // Auto-close menu on mobile setiap kali pengguna klik salah satu menu
      if (window.innerWidth < 768) {
        closeMobileMenu();
      }

      // Update UI state nav
      document.querySelectorAll('#nav-menu button').forEach(btn => {
        btn.classList.remove('bg-emerald-600/20', 'text-emerald-400', 'border', 'border-emerald-500/30');
      });
      const activeBtn = document.getElementById(`nav-btn-${viewId}`);
      if(activeBtn) activeBtn.classList.add('bg-emerald-600/20', 'text-emerald-400', 'border', 'border-emerald-500/30');

      const content = document.getElementById('main-content');
      content.innerHTML = '<div class="flex justify-center items-center h-full"><div class="loader h-10 w-10"></div></div>';

      // Routing Logic (Real-time fetching pada setiap klik navigasi)
      if (currentUser.role === 'Admin') {
        if (viewId === 'dashboard') renderAdminDashboard();
        if (viewId === 'siswa') renderAdminSiswa();
        if (viewId === 'transaksi') renderAdminTransaksi();
        if (viewId === 'rekap') renderAdminRekap();
      } else {
        if (viewId === 'dashboard') renderWaliDashboard();
      }
    }

    function renderAdminDashboard() {
  showLoader();
  google.script.run
    .withSuccessHandler(data => {
      hideLoader();
      const html = `
        <h2 class="text-2xl font-bold mb-6 text-white"><i class="fas fa-home mr-2 text-emerald-500"></i> Dashboard</h2>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div class="glass-panel p-6 rounded-2xl border border-slate-700 fade-in transform transition hover:-translate-y-1">
            <p class="text-slate-400 text-sm font-semibold mb-1">Total Tabungan</p>
            <h3 class="text-3xl font-bold text-white mb-2">${formatRp(data.totalTabungan)}</h3>
            <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden"><div class="bg-emerald-500 h-full w-full"></div></div>
          </div>
          <div class="glass-panel p-6 rounded-2xl border border-slate-700 fade-in transform transition hover:-translate-y-1" style="animation-delay: 0.1s">
            <p class="text-slate-400 text-sm font-semibold mb-1">Setoran Bulan Ini</p>
            <h3 class="text-3xl font-bold text-white mb-2">${formatRp(data.totalSetoranBulanIni)}</h3>
            <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden"><div class="bg-blue-500 h-full w-3/4"></div></div>
          </div>
          <div class="glass-panel p-6 rounded-2xl border border-slate-700 fade-in transform transition hover:-translate-y-1" style="animation-delay: 0.2s">
            <p class="text-slate-400 text-sm font-semibold mb-1">Siswa Aktif</p>
            <h3 class="text-3xl font-bold text-white mb-2">${data.jumlahSiswa} <span class="text-sm font-normal text-slate-400">Siswa</span></h3>
            <div class="w-full bg-slate-700 h-1.5 rounded-full overflow-hidden"><div class="bg-purple-500 h-full w-1/2"></div></div>
          </div>
        </div>
        
        <div class="glass-panel rounded-2xl overflow-hidden border border-slate-700 fade-in mt-6" style="animation-delay: 0.3s">
          <div class="p-4 border-b border-slate-700 bg-slate-800/50">
            <h3 class="font-semibold text-white">Grafik Setoran (7 Hari Terakhir)</h3>
          </div>
          <div class="p-4 h-72 relative w-full">
            <canvas id="mingguanChart"></canvas>
          </div>
        </div>
      `;
      document.getElementById('main-content').innerHTML = html;

      // --- INIT CHART.JS SETELAH HTML DIRENDER ---
      google.script.run.withSuccessHandler(chartData => {
        const ctx = document.getElementById('mingguanChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: chartData.labels,
            datasets: [{
              label: 'Total Setoran (Rp)',
              data: chartData.data,
              borderColor: '#10b981', // Warna Emerald
              backgroundColor: 'rgba(16, 185, 129, 0.2)', // Emerald transparan
              borderWidth: 2,
              fill: true,
              tension: 0.4, // Membuat garis melengkung halus
              pointBackgroundColor: '#10b981'
            }]
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: { legend: { display: false } },
            scales: {
              y: { 
                beginAtZero: true,
                grid: { color: '#334155' },
                ticks: { color: '#94a3b8' }
              },
              x: {
                grid: { color: '#334155' },
                ticks: { color: '#94a3b8' }
              }
            }
          }
        });
      }).getGrafikMingguan();

    }).getDashboardData('Admin');
}

function renderAdminSiswa() {
      google.script.run
        .withSuccessHandler(data => {
          dataSiswaCache = data; // Cache untuk dropdown trx
          let tableRows = data.map((s, idx) => `
            <tr class="border-b border-slate-700 hover:bg-slate-800/50 transition-colors">
              <td class="p-4 text-sm text-slate-300 text-center">${idx + 1}</td>
              <td class="p-4">
                <p class="font-bold text-white">${s.nama}</p>
                <p class="text-xs text-slate-400">${s.id}</p>
              </td>
              <td class="p-4 text-sm text-slate-300">${s.kelas}</td>
              <td class="p-4 text-sm text-slate-300"><i class="fab fa-whatsapp text-emerald-500"></i> ${s.noWa}</td>
              <td class="p-4">
                <span class="bg-slate-700 px-2 py-1 rounded text-xs text-slate-300">${s.username}</span>
              </td>
              <td class="p-4 text-center">
                <button onclick="editSiswa('${s.id}')" class="text-blue-400 hover:text-blue-300 mr-3"><i class="fas fa-edit"></i></button>
                <button onclick="hapusSiswa('${s.id}')" class="text-red-400 hover:text-red-300"><i class="fas fa-trash"></i></button>
              </td>
            </tr>
          `).join('');

          if(data.length === 0) tableRows = `<tr><td colspan="6" class="p-8 text-center text-slate-500">Belum ada data siswa.</td></tr>`;

          const html = `
            <div class="flex flex-col md:flex-row justify-between items-center mb-6 fade-in">
              <h2 class="text-2xl font-bold text-white"><i class="fas fa-users mr-2 text-emerald-500"></i> Data Siswa</h2>
              <button onclick="openModalSiswa()" class="mt-4 md:mt-0 px-4 py-2 bg-emerald-600 hover:bg-emerald-500 rounded-lg text-white font-bold shadow-lg flex items-center transition-all">
                <i class="fas fa-plus mr-2"></i> Tambah Siswa
              </button>
            </div>
            <div class="glass-panel rounded-2xl overflow-hidden border border-slate-700 fade-in">
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-800 border-b border-slate-700">
                      <th class="p-4 font-semibold text-sm text-emerald-400 w-16 text-center">No</th>
                      <th class="p-4 font-semibold text-sm text-emerald-400">Nama Siswa</th>
                      <th class="p-4 font-semibold text-sm text-emerald-400">Kelas</th>
                      <th class="p-4 font-semibold text-sm text-emerald-400">No. WA</th>
                      <th class="p-4 font-semibold text-sm text-emerald-400">Akun (User)</th>
                      <th class="p-4 font-semibold text-sm text-emerald-400 text-center w-24">Aksi</th>
                    </tr>
                  </thead>
                  <tbody>${tableRows}</tbody>
                </table>
              </div>
            </div>
          `;
          document.getElementById('main-content').innerHTML = html;
        }).getSiswa();
    }

    function openModalSiswa() {
      document.getElementById('form-siswa').reset();
      document.getElementById('siswa-id').value = '';
      document.getElementById('modal-siswa-title').innerText = "Tambah Siswa Baru";
      document.getElementById('modal-siswa').classList.remove('hidden');
      document.getElementById('modal-siswa').classList.add('flex');
    }

    function closeModalSiswa() {
      document.getElementById('modal-siswa').classList.add('hidden');
      document.getElementById('modal-siswa').classList.remove('flex');
    }

    function editSiswa(id) {
      const siswa = dataSiswaCache.find(s => s.id === id);
      if(siswa) {
        document.getElementById('siswa-id').value = siswa.id;
        document.getElementById('siswa-nama').value = siswa.nama;
        document.getElementById('siswa-kelas').value = siswa.kelas;
        document.getElementById('siswa-wa').value = siswa.noWa;
        document.getElementById('siswa-user').value = siswa.username;
        document.getElementById('siswa-pass').value = siswa.password;
        
        document.getElementById('modal-siswa-title').innerText = "Edit Data Siswa";
        document.getElementById('modal-siswa').classList.remove('hidden');
        document.getElementById('modal-siswa').classList.add('flex');
      }
    }

    // WAJIB ANTI-DELAY: Real-time re-render setelah sukses
    function simpanSiswa(e) {
      e.preventDefault();
      const id = document.getElementById('siswa-id').value;
      const isEdit = id !== '';
      
      const formData = {
        id: id,
        nama: document.getElementById('siswa-nama').value,
        kelas: document.getElementById('siswa-kelas').value,
        noWa: document.getElementById('siswa-wa').value,
        username: document.getElementById('siswa-user').value,
        password: document.getElementById('siswa-pass').value
      };

      closeModalSiswa();
      showLoader();

      google.script.run
        .withSuccessHandler(res => {
          hideLoader();
          if(res.success) {
            Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 1500, showConfirmButton: false, background: '#1e293b', color: '#fff' });
            renderAdminSiswa(); // RE-RENDER REAL-TIME
          } else {
            showAlert('Gagal', res.message, 'error');
          }
        }).simpanSiswa(formData, isEdit);
    }

    function hapusSiswa(id) {
      Swal.fire({
        title: 'Yakin Hapus?',
        text: "Data siswa beserta akun login akan dihapus permanen!",
        icon: 'warning',
        showCancelButton: true,
        confirmButtonColor: '#ef4444',
        cancelButtonColor: '#64748b',
        confirmButtonText: 'Ya, Hapus!',
        background: '#1e293b', color: '#fff'
      }).then((result) => {
        if (result.isConfirmed) {
          showLoader();
          google.script.run
            .withSuccessHandler(res => {
              hideLoader();
              if(res.success) renderAdminSiswa(); // RE-RENDER REAL-TIME
            }).hapusSiswa(id);
        }
      })
    }

    function renderAdminTransaksi() {
      // Fetch siswa list for dropdown first
      google.script.run
        .withSuccessHandler(siswaData => {
          dataSiswaCache = siswaData;
          let options = siswaData.map(s => `<option value="${s.id}">${s.nama} (${s.kelas})</option>`).join('');
          
          const html = `
            <div class="max-w-3xl mx-auto fade-in">
              <h2 class="text-2xl font-bold mb-6 text-white"><i class="fas fa-exchange-alt mr-2 text-emerald-500"></i> Input Transaksi</h2>
              
              <div class="glass-panel p-6 md:p-8 rounded-2xl border border-slate-700 shadow-2xl relative overflow-hidden">
                <div class="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-emerald-500 to-blue-500"></div>
                
                <form id="form-transaksi" onsubmit="submitTransaksi(event)">
                  <div class="mb-6">
                    <label class="block text-sm font-medium text-slate-300 mb-2">Pilih Siswa</label>
                    <select id="trx-siswa" required class="input-dark w-full px-4 py-3 rounded-lg text-white appearance-none">
                      <option value="">-- Cari / Pilih Siswa --</option>
                      ${options}
                    </select>
                  </div>
                  
                  <div class="mb-6 grid grid-cols-2 gap-4">
                    <div>
                      <label class="block text-sm font-medium text-slate-300 mb-2">Jenis Transaksi</label>
                      <div class="flex bg-slate-800 rounded-lg p-1 border border-slate-700">
                        <label class="flex-1 text-center">
                          <input type="radio" name="trx-jenis" value="Setoran" required class="hidden peer">
                          <div class="peer-checked:bg-emerald-600 peer-checked:text-white text-slate-400 py-2 rounded-md cursor-pointer transition-colors font-medium">Setoran</div>
                        </label>
                        <label class="flex-1 text-center">
                          <input type="radio" name="trx-jenis" value="Penarikan" required class="hidden peer">
                          <div class="peer-checked:bg-red-500 peer-checked:text-white text-slate-400 py-2 rounded-md cursor-pointer transition-colors font-medium">Penarikan</div>
                        </label>
                      </div>
                    </div>
                    <div>
                      <label class="block text-sm font-medium text-slate-300 mb-2">Nominal (Rp)</label>
                      <div class="relative">
                        <span class="absolute left-4 top-3 text-slate-400 font-bold">Rp</span>
                        <input type="number" id="trx-nominal" required class="input-dark w-full pl-12 pr-4 py-3 rounded-lg font-bold text-emerald-400 text-lg" placeholder="0">
                      </div>
                    </div>
                  </div>
                  
                  <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-4 px-4 rounded-xl shadow-lg transition-all transform hover:-translate-y-1 mt-4">
                    <i class="fas fa-save mr-2"></i> Simpan Transaksi
                  </button>
                </form>
              </div>
            </div>
          `;
          document.getElementById('main-content').innerHTML = html;
        }).getSiswa();
    }

    // WAJIB ANTI-DELAY
    function submitTransaksi(e) {
      e.preventDefault();
      
      const idSiswa = document.getElementById('trx-siswa').value;
      const namaSiswa = document.getElementById('trx-siswa').options[document.getElementById('trx-siswa').selectedIndex].text;
      const jenis = document.querySelector('input[name="trx-jenis"]:checked').value;
      const nominal = document.getElementById('trx-nominal').value;

      Swal.fire({
        title: 'Konfirmasi Transaksi',
        html: `Apakah data sudah benar?<br><br><b>Siswa:</b> ${namaSiswa}<br><b>Jenis:</b> ${jenis}<br><b>Nominal:</b> ${formatRp(nominal)}`,
        icon: 'question', showCancelButton: true, confirmButtonText: 'Ya, Simpan!', background: '#1e293b', color: '#fff'
      }).then((result) => {
        if (result.isConfirmed) {
          showLoader();
          google.script.run
            .withSuccessHandler(res => {
              hideLoader();
              if(res.success) {
                Swal.fire({ icon: 'success', title: 'Berhasil', text: res.message, timer: 1500, background: '#1e293b', color: '#fff', showConfirmButton: false });
                document.getElementById('form-transaksi').reset();
                // Arahkan ke rekap untuk pamer data real-time
                navigate('rekap');
              } else {
                showAlert('Gagal', res.message, 'error');
              }
            }).simpanTransaksi({ idSiswa, namaSiswa: namaSiswa.split(' (')[0], jenis, nominal }); // Bersihkan nama dari kelas
        }
      });
    }

    function renderAdminRekap() {
      google.script.run
        .withSuccessHandler(data => {
          let tableRows = data.map((t, idx) => {
            const badgeClass = t.jenis === 'Setoran' ? 'bg-emerald-500/20 text-emerald-400 border-emerald-500/30' : 'bg-red-500/20 text-red-400 border-red-500/30';
            const nomClass = t.jenis === 'Setoran' ? 'text-emerald-400' : 'text-red-400';
            const sign = t.jenis === 'Setoran' ? '+' : '-';
            
            // TOMBOL INSTAN: Semua data, termasuk No WA dan Saldo Akhir, diteruskan langsung ke dalam tombol
            const btnWa = `<button onclick="kirimWAInstan('${t.idSiswa}', '${t.namaSiswa}', '${t.jenis}', '${t.nominal}', '${t.noWa}', '${t.saldo}')" class="bg-green-600 hover:bg-green-500 text-white text-xs px-3 py-1 rounded shadow inline-flex items-center transition-transform hover:scale-105"><i class="fab fa-whatsapp mr-1"></i> Kirim Notif</button>`;

            return `
            <tr class="border-b border-slate-700 hover:bg-slate-800/50">
              <td class="p-3 text-sm text-slate-300">${t.waktu}</td>
              <td class="p-3 font-semibold text-white">${t.namaSiswa}</td>
              <td class="p-3"><span class="px-2 py-1 text-xs border rounded-full ${badgeClass}">${t.jenis}</span></td>
              <td class="p-3 font-bold ${nomClass} text-right">${sign} ${formatRp(t.nominal)}</td>
              <td class="p-3 text-center">${btnWa}</td>
            </tr>
          `}).join('');

          if(data.length === 0) tableRows = `<tr><td colspan="5" class="p-8 text-center text-slate-500">Belum ada riwayat transaksi.</td></tr>`;

          const html = `
            <h2 class="text-2xl font-bold mb-6 text-white"><i class="fas fa-file-invoice-dollar mr-2 text-emerald-500"></i> Riwayat & Rekapitulasi</h2>
            <div class="glass-panel rounded-2xl overflow-hidden border border-slate-700 fade-in">
              <div class="p-4 border-b border-slate-700 bg-slate-800/50 flex justify-between items-center">
                <h3 class="font-semibold text-white">Mutasi Terakhir</h3>
                <span class="text-xs text-slate-400">Menampilkan seluruh data terbaru</span>
              </div>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="bg-slate-800 border-b border-slate-700">
                      <th class="p-3 font-semibold text-sm text-emerald-400">Waktu</th>
                      <th class="p-3 font-semibold text-sm text-emerald-400">Nama Siswa</th>
                      <th class="p-3 font-semibold text-sm text-emerald-400">Jenis</th>
                      <th class="p-3 font-semibold text-sm text-emerald-400 text-right">Nominal</th>
                      <th class="p-3 font-semibold text-sm text-emerald-400 text-center">Aksi</th>
                    </tr>
                  </thead>
                  <tbody>${tableRows}</tbody>
                </table>
              </div>
            </div>
          `;
          document.getElementById('main-content').innerHTML = html;
        }).getRekap();
    }

    // FUNGSI BARU: Langsung eksekusi tanpa loading
    function kirimWAInstan(idSiswa, nama, jenis, nominal, noWa, saldo) {
      // Cek apakah No WA dan Saldo sudah dikirim langsung dari backend saat load tabel
      if (noWa && noWa !== 'undefined' && noWa !== 'null') {
        bukaLinkWA(noWa, nama, jenis, nominal, saldo);
      } else {
        // FALLBACK: Jika backend Code.gs belum diupdate, jalankan mode lama (loading sesaat)
        showLoader();
        google.script.run
          .withSuccessHandler(data => {
            hideLoader();
            if (!data || !data.noWa) {
              showAlert('Gagal', 'Data WA tidak ditemukan atau kosong.', 'error');
              return;
            }
            bukaLinkWA(data.noWa, nama, jenis, nominal, data.saldo);
          })
          .withFailureHandler(err => {
            hideLoader();
            showAlert('Error Server', err.message, 'error');
          })
          .getWaData(idSiswa); 
      }
    }

    // Eksekutor Buka Tab API wa.me
    function bukaLinkWA(noWa, nama, jenis, nominal, saldo) {
      let noHp = noWa.toString();
      if(noHp.startsWith('0')) {
          noHp = '62' + noHp.substring(1);
      }
      
      const pesan = `Halo Bunda / Ayah dari ananda *${nama}*,\n\nKami informasikan bahwa terdapat transaksi *${jenis}* sebesar *${formatRp(nominal)}*.\n\nTotal Saldo Tabungan ananda saat ini adalah: *${formatRp(saldo)}*.\n\nTerima kasih,\nAdmin E-TabunganKu TK.`;
      const url = `https://wa.me/${noHp}?text=${encodeURIComponent(pesan)}`;
      
      // Buka instan. Karena sinkron dengan klik pengguna, Pop-up Blocker tidak akan aktif
      window.open(url, '_blank');
    }

    function renderWaliDashboard() {
      // Fetch 2 hal: Dashboard Summary (Saldo) dan Histori Trx untuk anak tersebut
      showLoader();
      google.script.run
        .withSuccessHandler(dashData => {
          google.script.run
            .withSuccessHandler(trxData => {
              hideLoader();
              
              let tableRows = trxData.map(t => {
                const badgeClass = t.jenis === 'Setoran' ? 'bg-emerald-500/20 text-emerald-400' : 'bg-red-500/20 text-red-400';
                const sign = t.jenis === 'Setoran' ? '+' : '-';
                return `
                <tr class="border-b border-slate-700 hover:bg-slate-800">
                  <td class="p-4 text-sm text-slate-300">${t.waktu.split(' ')[0]} <br> <span class="text-xs text-slate-500">${t.waktu.split(' ')[1]}</span></td>
                  <td class="p-4"><span class="px-2 py-1 text-xs border border-slate-600 rounded-full ${badgeClass}">${t.jenis}</span></td>
                  <td class="p-4 font-bold text-white text-right">${sign} ${formatRp(t.nominal)}</td>
                </tr>
              `}).join('');

              if(trxData.length === 0) tableRows = `<tr><td colspan="3" class="p-8 text-center text-slate-500">Belum ada mutasi tabungan.</td></tr>`;

              const html = `
                <h2 class="text-2xl font-bold mb-6 text-white">Buku Tabungan Digital</h2>
                
                <!-- Card Saldo -->
                <div class="glass-panel p-8 rounded-2xl border-t-4 border-emerald-500 relative overflow-hidden mb-8 shadow-2xl fade-in flex items-center justify-between">
                  <div class="z-10">
                    <p class="text-emerald-400 text-sm font-medium mb-1 uppercase tracking-wider">Total Saldo Ananda</p>
                    <h3 class="text-4xl md:text-5xl font-bold text-white mb-2">${formatRp(dashData.saldoAwal)}</h3>
                    <p class="text-slate-400 text-sm">Pemilik Akun: <b>${currentUser.nama}</b> (${currentUser.kelas})</p>
                  </div>
                  <i class="fas fa-wallet text-8xl text-emerald-500 opacity-20 absolute -right-4 top-4 transform rotate-12 z-0"></i>
                </div>

                <!-- Histori Mutasi -->
                <h3 class="text-xl font-bold mb-4 text-slate-300"><i class="fas fa-history mr-2"></i> Riwayat Mutasi</h3>
                <div class="glass-panel rounded-2xl overflow-hidden border border-slate-700 fade-in shadow-xl">
                  <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse">
                      <thead>
                        <tr class="bg-slate-800 border-b border-slate-700">
                          <th class="p-4 font-semibold text-sm text-emerald-400">Waktu</th>
                          <th class="p-4 font-semibold text-sm text-emerald-400">Jenis</th>
                          <th class="p-4 font-semibold text-sm text-emerald-400 text-right">Nominal</th>
                        </tr>
                      </thead>
                      <tbody>${tableRows}</tbody>
                    </table>
                  </div>
                </div>
              `;
              document.getElementById('main-content').innerHTML = html;
            }).getRekap(currentUser.id); // Fetch mutasi spesifik siswa
        }).getDashboardData('Wali/Siswa', currentUser.id); // Fetch saldo spesifik
    }

  </script>
